<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Training{% endblock %} · bulltraining</title>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#e3e3e0; --accent:#3a7be0;
        --ok:#2f9e5b; --warn:#c98a12; --bad:#d0463b; }
@media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1e1e21; --fg:#ececec; --muted:#9a9aa0; --line:#2e2e33; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
nav { display:flex; gap:4px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
nav a { color:var(--fg); text-decoration:none; padding:6px 10px; border-radius:6px; }
nav a:hover, nav a.on { background:var(--bg); }
nav .brand { font-weight:700; margin-right:12px; }
.badge { background:var(--bad); color:#fff; border-radius:9px; padding:0 6px; font-size:12px; margin-left:4px; }
main { max-width:1200px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:4px 0 14px; } h2 { font-size:16px; margin:22px 0 8px; } h3 { font-size:14px; margin:12px 0 6px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); }
.muted { color:var(--muted); } .small { font-size:12px; }
.ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
.pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:var(--bg); border:1px solid var(--line); }
.pill.valid { border-color:var(--ok); color:var(--ok); } .pill.due_soon { border-color:var(--warn); color:var(--warn); }
.pill.stale, .pill.missing { border-color:var(--bad); color:var(--bad); }
table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-weight:600; color:var(--muted); font-size:12px; }
.scroll { overflow-x:auto; }
button, .btn { font:inherit; padding:5px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; text-decoration:none; display:inline-block; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { color:var(--bad); }
input, select, textarea { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
label { display:block; margin:6px 0 2px; font-size:12px; color:var(--muted); }
.flash { padding:8px 12px; border-radius:8px; margin-bottom:12px; border:1px solid var(--ok); }
.flash.err { border-color:var(--bad); color:var(--bad); white-space:pre-line; }
.big { font-size:24px; font-weight:700; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
form.inline { display:inline; }
pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:8px; border-radius:6px; margin:4px 0; }
.week { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
.day { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px; min-height:120px; min-width:0; }
.day.today { border-color:var(--accent); }
.day h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
.s { border-left:4px solid; padding:3px 6px; margin:4px 0; border-radius:4px; background:var(--bg); font-size:12px; }
.s.done { opacity:.6; } .s.skipped { text-decoration:line-through; opacity:.5; }
.a { font-size:12px; padding:3px 6px; margin:4px 0; border-radius:4px; border:1px dashed var(--line); }
.a a { color:inherit; }
@media (max-width: 800px) { .week { grid-template-columns:1fr; } .day { min-height:0; } }
.s.pv { display:block; color:inherit; text-decoration:none; cursor:pointer; }
details.pvd { display:none; } details.pvd[open] { display:block; }
.s.pv.same { opacity:.55; }
.s.pv.removed { opacity:.6; text-decoration:line-through; background:transparent; border-style:dashed; }
.s.pv.new { outline:2px solid var(--ok); }
.s.pv.changed { outline:2px solid var(--warn); }
.tag { display:inline-block; font-size:11px; font-weight:700; padding:0 6px; border-radius:8px; color:#fff; text-decoration:none; }
.tag.new { background:var(--ok); } .tag.changed { background:var(--warn); } .tag.removed { background:var(--bad); }
.zb { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:3px; background:var(--line); }
.zb span { display:block; height:100%; }
.steps { display:flex; flex-direction:column; gap:6px; }
.step { display:grid; grid-template-columns:130px 170px 1fr; gap:10px; align-items:center; background:var(--card);
        border:1px solid var(--line); border-left:6px solid; border-radius:8px; padding:8px 12px; }
.step .dur { font-size:17px; font-weight:700; }
.step .zl { color:#fff; font-size:11px; padding:1px 6px; border-radius:8px; margin-left:4px; }
.step .tg { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:2px 10px; font-size:13px; white-space:nowrap; }
.sthead { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:10px 0 0; }
.rep { border:1px dashed var(--line); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:6px; }
.rephead { font-weight:700; font-size:13px; }
.stnote { font-size:13px; color:var(--muted); margin:6px 0 0; }
main a:not(.btn):not(.s) { color:var(--accent); }
a.s { display:block; color:inherit; text-decoration:none; } a.s:hover { outline:1px solid var(--accent); }
@media (max-width: 700px) { .step { grid-template-columns:1fr; gap:4px; } }
</style>
<script>
/* Gestapelte Zonenbalken: je Kategorie ein Balken "geplant" (hell) und "absolviert" (kräftig).
   rows: [{planned:[5], done:[5], done_no_zones|done_without_zones}], divisor: Sekunden->Minuten (60) bzw. Minuten->Stunden (60). */
function zoneChart(el, labels, rows, divisor, unit) {
  const Z = {{ zone_names|tojson_safe }}, C = {{ zone_colors|tojson_safe }};
  const r1 = v => Math.round(v / divisor * 10) / 10;
  const ds = [];
  Z.forEach((z, i) => ds.push({ label: z, zone: i, stack: 'plan', data: rows.map(r => r1(r.planned[i])),
    backgroundColor: C[i] + '80', borderColor: C[i], borderWidth: 1.5 }));
  Z.forEach((z, i) => ds.push({ label: z, zone: i, stack: 'done', data: rows.map(r => r1(r.done[i])), backgroundColor: C[i] }));
  ds.push({ label: 'ohne Zonendaten', zone: 5, stack: 'done', backgroundColor: '#b8b8b8',
    data: rows.map(r => r1(r.done_no_zones ?? r.done_without_zones ?? 0)) });
  return new Chart(el, { type: 'bar', data: { labels, datasets: ds },
    options: { animation: false, maintainAspectRatio: false,
      scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: unit } } },
      plugins: {
        legend: { labels: { filter: (item, data) => data.datasets[item.datasetIndex].stack === 'done' },
          onClick: (e, item, legend) => { const ch = legend.chart, zone = ch.data.datasets[item.datasetIndex].zone;
            ch.data.datasets.forEach((d, i) => { if (d.zone === zone) ch.setDatasetVisibility(i, !ch.isDatasetVisible(i)); }); ch.update(); } },
        tooltip: { filter: it => it.raw > 0,
          callbacks: { label: it => `${it.dataset.stack === 'plan' ? 'geplant' : 'absolviert'} · ${it.dataset.label}: ${it.raw} ${unit}` } } } } });
}
</script>
</head>
<body hx-boost="true">
<nav>
  <span class="brand">bulltraining</span>
  {% set p = request.url.path %}
  <a href="{{ root }}/calendar" class="{{ 'on' if p.startswith('/calendar') }}">Kalender</a>
  <a href="{{ root }}/performance" class="{{ 'on' if p.startswith('/performance') }}">Leistung</a>
  <a href="{{ root }}/form" class="{{ 'on' if p.startswith('/form') }}">Form</a>
  <a href="{{ root }}/inbox" class="{{ 'on' if p.startswith('/inbox') }}">Posteingang{% if inbox_count %}<span class="badge">{{ inbox_count }}</span>{% endif %}</a>
  <a href="{{ root }}/plans" class="{{ 'on' if p.startswith('/plans') }}">Pläne</a>
  <a href="{{ root }}/settings" class="{{ 'on' if p.startswith('/settings') }}">Einstellungen</a>
</nav>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
