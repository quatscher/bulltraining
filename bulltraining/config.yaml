name: bulltraining
version: "0.4.1"
slug: bulltraining
description: Endurance training planning with intervals.icu, performance tests and an MCP server for Claude
url: https://github.com/quatscher/bulltraining
# Fertige Images aus GitHub Actions (tools/build_addon.py entfernt die Zeile für lokale Builds)
image: ghcr.io/quatscher/{arch}-addon-bulltraining
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: Training
ports:
  8765/tcp: null
ports_description:
  8765/tcp: MCP server for Claude (token required; disabled by default)
map:
  - share:rw
options:
  intervals_api_key: ""
  intervals_athlete_id: "0"
  mcp_token: ""
  sync_interval_minutes: 60
schema:
  intervals_api_key: password?
  intervals_athlete_id: str
  mcp_token: password?
  sync_interval_minutes: int(0,1440)
