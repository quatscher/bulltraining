name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src tests tools
      - run: python -W error -m compileall -q src tests tools
      - run: python -m pytest -q
