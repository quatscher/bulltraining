name: Add-on images

# Baut die Images, die bulltraining/config.yaml per `image:` referenziert.
# Auslöser: ein Versions-Tag (v0.3.0), der zu pyproject.toml und config.yaml passen muss.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Version prüfen
        id: version
        run: |
          v=$(grep -Po '^version = "\K[^"]+' pyproject.toml)
          c=$(grep -Po '^version: "\K[^"]+' bulltraining/config.yaml)
          test "$v" = "$c" || { echo "pyproject ($v) und config.yaml ($c) weichen ab"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME}" = "v$v" || { echo "Tag passt nicht zu $v"; exit 1; }; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-bulltraining:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-bulltraining:latest
