[project]
name = "bulltraining"
version = "0.4.0"
description = "Endurance training planning with intervals.icu, performance tests and an MCP server for Claude"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "quatscher"}]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "mcp>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/quatscher/bulltraining"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bulltraining = "bulltraining.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bulltraining = ["plan_templates/*.json", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
