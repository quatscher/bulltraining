name: bulltraining
version: "0.2.0"
slug: bulltraining
description: Trainingsplanung mit intervals.icu, Leistungstests und MCP-Zugang für Claude
url: https://github.com/quatscher/bulltraining
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: Training
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: MCP-Server für Claude (nur mit Token)
map:
  - share:rw
options:
  intervals_api_key: ""
  intervals_athlete_id: "0"
  mcp_token: ""
  sync_interval_minutes: 60
schema:
  intervals_api_key: password?
  intervals_athlete_id: str
  mcp_token: password?
  sync_interval_minutes: int(0,1440)
